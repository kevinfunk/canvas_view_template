services:
  Drupal\canvas_view_template\Render\ViewTemplateRenderer: {}
  canvas_view_template.route_subscriber:
    class: Drupal\canvas_view_template\Routing\ViewTemplateRouteSubscriber
    tags:
      - { name: event_subscriber }
  canvas_view_template.entity_form_fields_subscriber:
    class: Drupal\canvas_view_template\EventSubscriber\ViewTemplateEntityFormFieldsSubscriber
    tags:
      - { name: event_subscriber }
  Drupal\canvas_view_template\ViewTemplateUsage:
    arguments: ['@config.factory', '@entity_type.manager']
  Drupal\canvas_view_template\ViewTemplateUninstallValidator:
    arguments: ['@Drupal\canvas_view_template\ViewTemplateUsage']
    tags:
      - { name: module_install.uninstall_validator }
  Drupal\canvas_view_template\ViewTemplateDrafts:
    arguments: ['@Drupal\canvas\AutoSave\AutoSaveManager']
  Drupal\canvas_view_template\Preview\ViewTemplatePreviewSelection:
    arguments:
      - '@tempstore.private'
      - '@Drupal\canvas_view_template\ViewTemplateUsage'
  Drupal\canvas_view_template\Preview\ViewPreviewBuilder: {}
  Drupal\canvas_view_template\Preview\ViewTemplateLivePreview:
    arguments:
      - '@Drupal\canvas_view_template\Preview\ViewTemplatePreviewSelection'
      - '@Drupal\canvas_view_template\Preview\ViewPreviewBuilder'
      - '@Drupal\canvas_view_template\Render\ViewTemplateRenderer'
      - '@Drupal\canvas_view_template\ViewTemplateDrafts'
  canvas_view_template.preview_subscriber:
    class: Drupal\canvas_view_template\EventSubscriber\ViewTemplatePreviewSubscriber
    arguments:
      - '@Drupal\canvas_view_template\Preview\ViewTemplatePreviewSelection'
      - '@url_generator'
      - '@Drupal\canvas_view_template\ViewTemplateDrafts'
    tags:
      - { name: event_subscriber }
  canvas_view_template.entity_form_controller_subscriber:
    class: Drupal\canvas_view_template\EventSubscriber\ViewTemplateEntityFormControllerSubscriber
    arguments: ['@form_builder']
    tags:
      - { name: event_subscriber }
  canvas_view_template.page_variant_selector_subscriber:
    class: Drupal\canvas_view_template\EventSubscriber\ViewTemplatePageVariantSelectorSubscriber
    arguments: ['@entity_type.manager', '@router.admin_context', '@Drupal\canvas_view_template\Preview\ViewTemplatePreviewSelection']
    tags:
      - { name: event_subscriber }
  Drupal\canvas_view_template\Update\ComponentUpdater:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\canvas\AutoSave\AutoSaveManager'
      - '@extension.path.resolver'
      - '@config.installer'
