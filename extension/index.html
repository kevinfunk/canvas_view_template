<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View templates</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="panel__header">
      <h1 class="panel__title" data-t="View templates">View templates</h1>
      <button type="button" id="close-button" class="panel__close" aria-label="Close panel" data-t-aria-label="Close panel">

      </button>
    </header>

    <main class="panel">
      <p class="panel__hint" data-t="Canvas layouts that a Views display renders through. Choose one under the view's Format settings.">
        Canvas layouts that a Views display renders through. Choose one under
        the view's Format settings.
      </p>

      <div id="toolbar" class="toolbar" hidden>
        <div class="search">
          <svg class="search__icon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10 6.5C10 8.433 8.433 10 6.5 10C4.567 10 3 8.433 3 6.5C3 4.567 4.567 3 6.5 3C8.433 3 10 4.567 10 6.5ZM9.30884 10.0159C8.53901 10.6318 7.56251 11 6.5 11C4.01472 11 2 8.98528 2 6.5C2 4.01472 4.01472 2 6.5 2C8.98528 2 11 4.01472 11 6.5C11 7.56251 10.6318 8.53901 10.0159 9.30884L12.8536 12.1464C13.0488 12.3417 13.0488 12.6583 12.8536 12.8536C12.6583 13.0488 12.3417 13.0488 12.1464 12.8536L9.30884 10.0159Z" fill="currentColor"/></svg>
          <input type="search" id="search" class="search__input" autocomplete="off" aria-label="Search view templates" data-t-aria-label="Search view templates" />
        </div>
        <button type="button" id="new-button" class="soft-button" aria-label="New view template" data-t-aria-label="New view template">
          <svg class="icon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 2.75C8 2.47386 7.77614 2.25 7.5 2.25C7.22386 2.25 7 2.47386 7 2.75V7H2.75C2.47386 7 2.25 7.22386 2.25 7.5C2.25 7.77614 2.47386 8 2.75 8H7V12.25C7 12.5261 7.22386 12.75 7.5 12.75C7.77614 12.75 8 12.5261 8 12.25V8H12.25C12.5261 8 12.75 7.77614 12.75 7.5C12.75 7.22386 12.5261 7 12.25 7H8V2.75Z" fill="currentColor"/></svg>
          <span data-t="New">New</span>
        </button>
      </div>

      <div id="error-box" class="error-box" hidden>
        <p id="error" class="error" role="alert"></p>
        <button type="button" id="retry-button" class="link-button" data-t="Try again">Try again</button>
      </div>
      <p id="loading" class="muted" role="status" data-t="Loading…">Loading…</p>

      <p id="no-match" class="callout" hidden><svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.49991 0.876892C3.84222 0.876892 0.877075 3.84204 0.877075 7.49972C0.877075 11.1574 3.84222 14.1226 7.49991 14.1226C11.1576 14.1226 14.1227 11.1574 14.1227 7.49972C14.1227 3.84204 11.1576 0.876892 7.49991 0.876892ZM1.82707 7.49972C1.82707 4.36671 4.36689 1.82689 7.49991 1.82689C10.6329 1.82689 13.1727 4.36671 13.1727 7.49972C13.1727 10.6327 10.6329 13.1726 7.49991 13.1726C4.36689 13.1726 1.82707 10.6327 1.82707 7.49972ZM8.24992 4.49999C8.24992 4.9142 7.91413 5.24999 7.49992 5.24999C7.08571 5.24999 6.74992 4.9142 6.74992 4.49999C6.74992 4.08577 7.08571 3.74999 7.49992 3.74999C7.91413 3.74999 8.24992 4.08577 8.24992 4.49999ZM6.00003 5.99999H6.50003H7.50003C7.77618 5.99999 8.00003 6.22384 8.00003 6.49999V9.99999H8.50003H9.00003V11H8.50003H7.50003H6.50003H6.00003V9.99999H6.50003H7.00003V6.99999H6.50003H6.00003V5.99999Z" fill="currentColor"/></svg><span data-t="No view templates match your filter.">No view templates match your filter.</span></p>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
      <ul id="list" class="nodes"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
