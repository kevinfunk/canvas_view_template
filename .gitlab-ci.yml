################
# DrupalCI GitLabCI template for contrib projects, as generated for new
# drupal.org projects. See https://project.pages.drupalcode.org/gitlab_templates/
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Pipeline configuration variables, documented at
# https://project.pages.drupalcode.org/gitlab_templates/
################
variables:
  # This module needs Drupal ^11.4 and Canvas 1.13, so the "previous minor"
  # (11.3) and the major versions on either side cannot install it.
  OPT_IN_TEST_PREVIOUS_MINOR: '0'
  OPT_IN_TEST_PREVIOUS_MAJOR: '0'
  OPT_IN_TEST_NEXT_MAJOR: '0'
  # Test the current core, the next minor and the newest supported PHP.
  OPT_IN_TEST_CURRENT: '1'
  OPT_IN_TEST_NEXT_MINOR: '1'
  OPT_IN_TEST_MAX_PHP: '1'
  # Timing and memory tests (group canvas_view_template_slow) depend on how busy
  # a shared runner is, so the blocking jobs skip them. The "phpunit slow" job
  # below runs them without blocking the pipeline.
  _PHPUNIT_EXTRA: '--exclude-group=canvas_view_template_slow'

# Runs only the timing and memory tests, on current core. A failure here shows
# as a warning; read the numbers before treating it as a regression.
phpunit slow:
  extends: phpunit (current)
  allow_failure: true
  variables:
    _PHPUNIT_EXTRA: '--group=canvas_view_template_slow'

# The Node tests for the browser scripts need no Drupal, only Node 24 (the
# panel's ES modules load as .js, which older Node versions refuse). They are
# not part of the drupal.org templates. The smoke test loads the whole panel
# against a stub page, so a broken import or a leftover variable fails here,
# before any browser test runs.
node tests:
  stage: test
  image: node:24-alpine
  script:
    - node tests/js/live-preview.test.js
    - node tests/js/style-options.test.js
    - node tests/js/panel.test.mjs
    - node tests/js/panel-smoke.test.mjs
