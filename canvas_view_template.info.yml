name: 'Canvas View Template'
type: module
description: 'Provides a Canvas visual builder for templating Drupal Views displays.'
package: 'Canvas'
core_version_requirement: ^11.4
dependencies:
  - drupal:views
  # Canvas has no stable API yet and this module uses its internals: bound the
  # version to the one tested. See docs/canvas-coupling.md.
  - canvas:canvas (>=1.13, <1.14)
